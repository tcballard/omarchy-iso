name: Install snake ISO VM check

on:
  push:
    branches: [feat/install-snake-grid]
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: quattro
          path: deps/omarchy
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-pkgs
          ref: master
          path: deps/omarchy-pkgs
      - name: Free room for the ISO and VM disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install host VM and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf socat imagemagick tesseract-ocr tesseract-ocr-eng openssh-client
          sudo ln -s /usr/bin/convert /usr/local/bin/magick
          sudo mkdir -p /usr/share/edk2/x64
          code=/usr/share/OVMF/OVMF_CODE_4M.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -f "$code" && test -f "$vars" && test -c /dev/kvm
          sudo ln -s "$code" /usr/share/edk2/x64/OVMF_CODE.4m.fd
          sudo ln -s "$vars" /usr/share/edk2/x64/OVMF_VARS.4m.fd
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' >"$RUNNER_TEMP/bin/omarchy-pkg-add"
          chmod +x "$RUNNER_TEMP/bin/omarchy-pkg-add"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Build real ISO
        run: |
          # The T2 mirror currently lacks this optional Mac-only firmware.
          # A PC VM cannot use it; keep the branch's ISO/installer files intact.
          sed -i '/^apple-bcm-firmware$/d' deps/omarchy/install/omarchy-other.packages
          # Inject a reproducible child failure in this test image only, after
          # enough real package work for the snake to have visibly advanced.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("configs/airootfs/usr/local/bin/omarchy-install-dashboard")
          original = p.read_text()
          needle = "launch_child\n\ntick=0"
          assert original.count(needle) == 1
          injected = 'launch_child\n( sleep 70; echo "FORCED VM FAILURE: stopping installer child" >>"$LOG_FILE"; kill -- -"$child_pgid" ) &\n\ntick=0'
          p.write_text(original.replace(needle, injected))
          PY
          ./bin/omarchy-iso-make --local-source deps/omarchy deps/omarchy-pkgs --keep-pkg-cache --no-boot-offer
      - name: Confirm forced install failure and readable screen
        run: |
          iso=$(ls -t release/*.iso | head -n1)
          if ./bin/omarchy-iso-test "$iso" --install-only --no-preview --memory 4096 --timeout 3600; then\n            echo "Expected the injected installer failure" >&2\n            exit 1\n          fi\n          find test-runs -name failure-installer-installation-stopped.png | grep -q .
      - name: Upload real installer screens and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-snake-forced-failure-evidence
          path: |
            test-runs/**/*.png
            test-runs/**/install-serial.log
            test-runs/**/omarchy-install.log
          if-no-files-found: warn
          retention-days: 3
